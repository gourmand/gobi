name: 'Build VS Code Extension'
description: 'Build VS Code extension for a specific platform'
inputs:
  platform:
    description: 'Target platform (win32, linux, alpine, darwin)'
    required: true
  arch:
    description: 'Target architecture (x64, arm64, armhf)'
    required: true
  npm_config_arch:
    description: 'npm config arch (x64, arm64, arm)'
    required: true
  pre-release:
    description: 'Whether to build as pre-release'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for downloading ripgrep'
    required: true
outputs:
  target:
    description: 'The target string used for the build'
    value: ${{ steps.set-target.outputs.target }}
  vsix-path:
    description: 'Path to the generated VSIX file'
    value: 'extensions/vscode/*.vsix'
  build-path:
    description: 'Path to the build artifacts'
    value: 'extensions/vscode/build'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    - name: Set target variable
      id: set-target
      shell: bash
      run: echo "target=${{ inputs.platform }}-${{ inputs.arch }}" >> $GITHUB_OUTPUT
    
    - name: Install workspace dependencies and build packages
      shell: bash
      run: |
        command -v pnpm || npm install -g pnpm@10
        pnpm install --frozen-lockfile
        pnpm -r build
      env:
        # https://github.com/microsoft/vscode-ripgrep/issues/9#issuecomment-643965333
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Install gui dependencies
      shell: bash
      run: |
        cd gui
        npm ci

    - name: Install core dependencies
      shell: bash
      run: |
        cd core
        npm ci
        npm i vectordb

    - name: Build GUI
      shell: bash
      run: |
        cd gui
        npm run build --max-old-space-size=4096
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    - name: Prepackage the extension
      shell: bash
      run: |
        cd extensions/vscode
        pnpm run prepackage -- --target ${{ steps.set-target.outputs.target }}

    - name: Re-install esbuild
      shell: bash
      run: |
        cd extensions/vscode
        pnpm add -D -w esbuild --force
 
    - name: Package extension (.vsix files)
      shell: bash
      run: |
        cd extensions/vscode
        if [ "${{ inputs.pre-release }}" = "true" ]; then
          pnpm dlx vsce package --pre-release --no-dependencies --target ${{ steps.set-target.outputs.target }}
        else
          pnpm dlx vsce package --no-dependencies --target ${{ steps.set-target.outputs.target }}
        fi
